<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Error · Gojo</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-page);
      padding: var(--space-4);
    }
    .error-card {
      max-width: 440px;
      width: 100%;
      text-align: center;
      padding: var(--space-8);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-full);
      background: var(--danger-light);
      color: var(--danger);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-4);
    }
    .error-title {
      font-size: 1.5rem;
      margin-bottom: var(--space-2);
    }
    .error-desc {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: var(--space-6);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="icon-wrapper">
      <i data-lucide="alert-triangle" style="width: 32px; height: 32px;"></i>
    </div>
    <h1 class="error-title">Unexpected Delay</h1>
    <p class="error-desc">We encountered an issue processing your request. Our team has been alerted.</p>
    <a href="/dashboard" class="btn btn-primary" style="width: 100%;">
      <i data-lucide="home" style="width: 18px; height: 18px;"></i>
      Return to Dashboard
    </a>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
