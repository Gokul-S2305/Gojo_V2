services:
  # Web Service
  - type: web
    name: gojo-trip-planner
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    # Single worker required for in-memory WebSocket connection state
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_ECHO
        value: false
      - key: MAX_UPLOAD_SIZE
        value: 10485760
      - key: ALLOWED_EXTENSIONS
        value: jpg,jpeg,png,gif,webp
      - key: SITE_URL
        value: https://gojo-trip-planner.onrender.com
      # Cloudinary (Persistent storage)
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Sentry
      - key: SENTRY_DSN
        sync: false
      # AI & APIs
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
